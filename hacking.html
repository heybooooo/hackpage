```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기기 보안 검사</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #202124;
            font-family: Arial, sans-serif;
        }

        .top {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 35px;
            font-weight: bold;
        }

        .shield {
            width: 30px;
            height: 34px;
            background: #2563eb;
            clip-path: polygon(
                50% 0%,
                90% 15%,
                90% 55%,
                50% 100%,
                10% 55%,
                10% 15%
            );
            margin-right: 12px;
        }

        .container {
            width: 720px;
            max-width: 90%;
            margin: 55px auto;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 25px;
            margin-top: 0;
        }

        .status {
            color: #666;
            margin-bottom: 25px;
        }

        .progress-area {
            margin: 25px 0;
        }

        .progress-background {
            height: 12px;
            width: 100%;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.15s;
        }

        #percent {
            text-align: right;
            margin-top: 8px;
            color: #555;
            font-size: 14px;
        }

        .scan-box {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .line {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .checking {
            color: #2563eb;
        }

        .done {
            color: #16a34a;
        }

        .danger {
            color: #dc2626;
        }

        #warning {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #dc2626;
            background: #fff1f2;
            color: #dc2626;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }

        .small {
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="top">
    <div class="shield"></div>
    기기 보안
</div>

<div class="container">

    <div class="card">

        <h1>보안 및 기기 검사</h1>

        <div class="status" id="status">
            보안 검사 초기화 중...
        </div>

        <div class="progress-area">

            <div class="progress-background">
                <div id="progress"></div>
            </div>

            <div id="percent">0%</div>

        </div>

        <div class="scan-box" id="scanBox">

            <div class="line">
                <span>기기 정보</span>
                <span class="checking">확인 중...</span>
            </div>

        </div>

        <div id="warning">
            ⚠ 귀하의 iPhone이 해킹되었습니다.<br>
            장치의 모든 작업을 도환의 MacBook Air(이)가 추적하고 있습니다.<br>
            즉각적인 조치가 필요합니다.
        </div>

        <div class="small">
            보안 서비스 • 암호화된 연결
        </div>

    </div>

</div>


<script>

const scanBox = document.getElementById("scanBox");
const progress = document.getElementById("progress");
const percent = document.getElementById("percent");
const status = document.getElementById("status");

const messages = [

    ["기기 정보", "기기 정보 감지됨"],
    ["네트워크 연결", "네트워크 연결됨"],
    ["IP 주소 범위", "14.128.128.0 — 14.128.255.255"],
    ["시스템 파일", "시스템 파일 검사 중"],
    ["연락처 데이터베이스", "연락처 데이터베이스 검사 중"],
    ["개인 정보", "개인 정보 감지됨"],
    ["암호화 전송", "암호화된 데이터 전송 중"],
    ["원격 기기", "도환의 기기에 연결 중"],
    ["최종 보안 검사", "보안 검사 완료"]

];

let current = 0;
let number = 0;


function addLine(title, result) {

    let line = document.createElement("div");

    line.className = "line";

    line.innerHTML =
        "<span>" + title + "</span>" +
        "<span class='done'>" + result + "</span>";

    scanBox.appendChild(line);
}


function startScan() {

    status.innerText =
        "기기 정보 검사 중...";

    let timer = setInterval(function() {

        number++;

        progress.style.width = number + "%";
        percent.innerText = number + "%";

        if (number % 11 === 0 && current < messages.length) {

            addLine(
                messages[current][0],
                messages[current][1]
            );

            current++;

        }

        if (number === 35) {
            status.innerText =
                "네트워크 연결 분석 중...";
        }

        if (number === 60) {
            status.innerText =
                "저장된 정보 검사 중...";
        }

        if (number === 80) {
            status.innerText =
                "암호화된 데이터 전송 중...";
        }

        if (number >= 100) {

            clearInterval(timer);

            status.innerText =
                "보안 검사 완료";

            setTimeout(function() {

                document.getElementById("warning")
                    .style.display = "block";

                alert(
                    "귀하의 iPhone이 해킹되었습니다.\n\n" +
                    "장치의 모든 작업을 도환의 MacBook Air(이)가 추적하고 있습니다.\n\n" +
                    "즉각적인 조치가 필요합니다."
                );

            }, 700);
        }

    }, 100);

}

window.onload = startScan;

</script>

</body>
</html>
```
